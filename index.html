<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Terraza al Cosmos - AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  body { margin:0; overflow:hidden; font-family:-apple-system,sans-serif; }
  #loading { position:fixed; inset:0; background:#000; color:#fff; display:flex; align-items:center; justify-content:center; z-index:999; font-size:16px; text-align:center; padding:20px; }

  #hint {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:20; text-align:center; color:#fff; font-size:15px; line-height:1.4;
    background:rgba(12,12,14,0.62); padding:16px 22px; border-radius:12px;
    max-width:78%; transition:opacity 0.4s ease; pointer-events:none;
  }
  #hint.hidden { opacity:0; }

  #nebulaPanel {
    position:fixed; top:56px; left:20px; right:20px; max-width:420px;
    font-family:'Inter', sans-serif;
    color:#eaf6ff; z-index:30; pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.6);
    opacity:0; transition:opacity 0.3s ease;
    white-space:pre-wrap; font-size:13.5px; line-height:1.4; letter-spacing:0.3px; font-weight:500;
  }
  #nebulaPanel.visible { opacity:1; }
  #nebulaPanel .label { color:#9fd8ff; opacity:0.85; }
  #nebulaPanel .cursor { display:inline-block; width:7px; background:#eaf6ff; margin-left:1px; animation:blink 0.9s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  #anclajeCaption {
    position:fixed; left:20px; right:20px; bottom:70px; z-index:30;
    font-family:'Inter', sans-serif; font-style:italic;
    font-size:13px; line-height:1.4; color:#eee;
    text-shadow:0 1px 4px rgba(0,0,0,0.9);
    opacity:0; transition:opacity 0.5s ease; text-align:left; pointer-events:none;
  }
  #anclajeCaption.visible { opacity:1; }

  #textToggleBtn {
    position:fixed; top:48px; right:16px; z-index:31;
    background:#1a1a1a; color:#fff; border:1px solid rgba(255,255,255,0.25);
    font-size:13px; padding:9px 16px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity 0.3s ease;
  }
  #textToggleBtn.shown { opacity:1; pointer-events:auto; }

  .a-enter-vr, .a-enter-ar { display:none !important; }

  #dimOverlay { position:fixed; inset:0; z-index:25; background:rgba(12,12,14,0); transition:background-color 0.35s ease; pointer-events:none; }
</style>
</head>
<body>
<div id="loading">Cargando reconocimiento...<br>(permití el acceso a la cámara cuando lo pida)</div>
<div id="hint" class="hidden">Apuntá la cámara a una foto<br>para ver su información</div>
<div id="nebulaPanel"></div>
<div id="anclajeCaption"></div>
<div id="dimOverlay"></div>
<button id="textToggleBtn">Ver ficha técnica</button>

<a-scene mindar-image="imageTargetSrc: ./targets.mind?v=20260816a; autoStart: true; uiScanning: no; uiLoading: no; filterMinCF: 0.0001; filterBeta: 0.2; warmupTolerance: 5; missTolerance: 10;"
  color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

  <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
  <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>
  <a-entity id="target-2" mindar-image-target="targetIndex: 2"></a-entity>
  <a-entity id="target-3" mindar-image-target="targetIndex: 3"></a-entity>
  <a-entity id="target-4" mindar-image-target="targetIndex: 4"></a-entity>
  <a-entity id="target-5" mindar-image-target="targetIndex: 5"></a-entity>
  <a-entity id="target-6" mindar-image-target="targetIndex: 6"></a-entity>
  <a-entity id="target-7" mindar-image-target="targetIndex: 7"></a-entity>
  <a-entity id="target-8" mindar-image-target="targetIndex: 8"></a-entity>
  <a-entity id="target-9" mindar-image-target="targetIndex: 9"></a-entity>
  <a-entity id="target-10" mindar-image-target="targetIndex: 10"></a-entity>
  <a-entity id="target-11" mindar-image-target="targetIndex: 11"></a-entity>

</a-scene>

<script>
  document.querySelector('a-scene').addEventListener('renderstart', () => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('hint').classList.remove('hidden');
  });

  var TARGETS = [{"type": "nebula", "titulo": "Carina", "catalogo": "NGC 3372", "constelacion": "Carina", "tipo": "Nebulosa de emisión", "distancia": "≈7.500 años luz", "paleta": "SHO", "horas": "7", "anclaje": "La luz capturada en esta imagen partió hace aproximadamente 7500 años, durante la difusión de la agricultura por el sur de Europa.", "aspect": 1.5, "overlay": "./carina-overlay.png"}, {"type": "nebula", "titulo": "Pléyades", "catalogo": "M45", "constelacion": "Tauro", "tipo": "Cúmulo estelar + nebulosa de reflexión", "distancia": "≈444 años luz", "paleta": "RGB", "horas": "5", "anclaje": "La luz capturada en esta imagen partió hace aproximadamente 444 años, cuando Shakespeare comenzaba a escribir sus obras.", "aspect": 1.5, "overlay": "./pleyades-overlay.png"}, {"type": "nebula", "titulo": "Pilares de la Creación", "catalogo": "M16", "constelacion": "Serpiente", "tipo": "Nebulosa de emisión", "distancia": "≈7.000 años luz", "paleta": "SHO", "horas": "21", "anclaje": "La luz capturada en esta imagen partió hace aproximadamente 7000 años, cuando comenzaba la domesticación de plantas en América.", "aspect": 1.0, "overlay": "./pilares-overlay.png"}, {"type": "moon", "overlay": "./moon-01-overlay.png", "aspect": 1.0, "data": {"type": "moon", "titulo": "La Luna", "diametro": "3.474 km", "edad": "≈4.500 millones de años", "distancia": "≈384.400 km (promedio)", "fecha": "10/01/2022", "lugar": "CABA, Argentina", "nota": "Esta imagen en alta resolución fue construida como un mosaico a partir de la captura de más de 60.000 cuadros individuales. Los colores que se observan en la superficie aparecen como resultado de aplicar capas de saturación a la imagen, que revelan la presencia de distintos metales, óxidos y minerales en el suelo lunar."}}, {"type": "moon", "overlay": "./moon-02-overlay.png", "aspect": 1.0, "data": {"type": "moon", "titulo": "La Luna", "diametro": "3.474 km", "edad": "≈4.500 millones de años", "distancia": "≈384.400 km (promedio)", "fecha": "10/01/2022", "lugar": "CABA, Argentina", "nota": "Esta imagen en alta resolución fue construida como un mosaico a partir de la captura de más de 60.000 cuadros individuales. Los colores que se observan en la superficie aparecen como resultado de aplicar capas de saturación a la imagen, que revelan la presencia de distintos metales, óxidos y minerales en el suelo lunar."}}, {"type": "moon", "overlay": "./moon-03-overlay.png", "aspect": 1.0, "data": {"type": "moon", "titulo": "La Luna", "diametro": "3.474 km", "edad": "≈4.500 millones de años", "distancia": "≈384.400 km (promedio)", "fecha": "10/01/2022", "lugar": "CABA, Argentina", "nota": "Esta imagen en alta resolución fue construida como un mosaico a partir de la captura de más de 60.000 cuadros individuales. Los colores que se observan en la superficie aparecen como resultado de aplicar capas de saturación a la imagen, que revelan la presencia de distintos metales, óxidos y minerales en el suelo lunar."}}, {"type": "moon", "overlay": "./moon-04-overlay.png", "aspect": 1.0, "data": {"type": "moon", "titulo": "La Luna", "diametro": "3.474 km", "edad": "≈4.500 millones de años", "distancia": "≈384.400 km (promedio)", "fecha": "10/01/2022", "lugar": "CABA, Argentina", "nota": "Esta imagen en alta resolución fue construida como un mosaico a partir de la captura de más de 60.000 cuadros individuales. Los colores que se observan en la superficie aparecen como resultado de aplicar capas de saturación a la imagen, que revelan la presencia de distintos metales, óxidos y minerales en el suelo lunar."}}, {"type": "moon", "overlay": "./moon-05-overlay.png", "aspect": 1.0, "data": {"type": "moon", "titulo": "La Luna", "diametro": "3.474 km", "edad": "≈4.500 millones de años", "distancia": "≈384.400 km (promedio)", "fecha": "10/01/2022", "lugar": "CABA, Argentina", "nota": "Esta imagen en alta resolución fue construida como un mosaico a partir de la captura de más de 60.000 cuadros individuales. Los colores que se observan en la superficie aparecen como resultado de aplicar capas de saturación a la imagen, que revelan la presencia de distintos metales, óxidos y minerales en el suelo lunar."}}, {"type": "moon", "overlay": "./moon-06-overlay.png", "aspect": 1.0, "data": {"type": "moon", "titulo": "La Luna", "diametro": "3.474 km", "edad": "≈4.500 millones de años", "distancia": "≈384.400 km (promedio)", "fecha": "10/01/2022", "lugar": "CABA, Argentina", "nota": "Esta imagen en alta resolución fue construida como un mosaico a partir de la captura de más de 60.000 cuadros individuales. Los colores que se observan en la superficie aparecen como resultado de aplicar capas de saturación a la imagen, que revelan la presencia de distintos metales, óxidos y minerales en el suelo lunar."}}, {"type": "moon", "overlay": "./moon-07-overlay.png", "aspect": 1.0, "data": {"type": "moon", "titulo": "La Luna", "diametro": "3.474 km", "edad": "≈4.500 millones de años", "distancia": "≈384.400 km (promedio)", "fecha": "10/01/2022", "lugar": "CABA, Argentina", "nota": "Esta imagen en alta resolución fue construida como un mosaico a partir de la captura de más de 60.000 cuadros individuales. Los colores que se observan en la superficie aparecen como resultado de aplicar capas de saturación a la imagen, que revelan la presencia de distintos metales, óxidos y minerales en el suelo lunar."}}, {"type": "moon", "overlay": "./moon-08-overlay.png", "aspect": 1.0, "data": {"type": "moon", "titulo": "La Luna", "diametro": "3.474 km", "edad": "≈4.500 millones de años", "distancia": "≈384.400 km (promedio)", "fecha": "10/01/2022", "lugar": "CABA, Argentina", "nota": "Esta imagen en alta resolución fue construida como un mosaico a partir de la captura de más de 60.000 cuadros individuales. Los colores que se observan en la superficie aparecen como resultado de aplicar capas de saturación a la imagen, que revelan la presencia de distintos metales, óxidos y minerales en el suelo lunar."}}, {"type": "moon", "overlay": "./moon-09-overlay.png", "aspect": 1.0, "data": {"type": "moon", "titulo": "La Luna", "diametro": "3.474 km", "edad": "≈4.500 millones de años", "distancia": "≈384.400 km (promedio)", "fecha": "10/01/2022", "lugar": "CABA, Argentina", "nota": "Esta imagen en alta resolución fue construida como un mosaico a partir de la captura de más de 60.000 cuadros individuales. Los colores que se observan en la superficie aparecen como resultado de aplicar capas de saturación a la imagen, que revelan la presencia de distintos metales, óxidos y minerales en el suelo lunar."}}];
  var VEIL_OPACITY = 0.55, VEIL_FADE_MS = 400, IMAGE_FADE_MS = 550, TYPING_SPEED = 9;
  var CAPTION_MODE = 'fade';

  var hint = document.getElementById('hint');
  var panelEl = document.getElementById('nebulaPanel');
  var captionEl = document.getElementById('anclajeCaption');
  var fichaBtn = document.getElementById('textToggleBtn');
  var dimOverlay = document.getElementById('dimOverlay');

  var timers = [];
  function clearAllTimers() { timers.forEach(function (t) { clearTimeout(t); clearInterval(t); }); timers = []; }

  var planes = {}; // targetIndex -> a-image element
  function ensurePlane(idx) {
    if (planes[idx]) return planes[idx];
    var n = TARGETS[idx];
    var target = document.getElementById('target-' + idx);
    var plane = document.createElement('a-image');
    plane.setAttribute('src', n.overlay + '?v=20260816a');
    var margin = 0.95;
    plane.setAttribute('width', margin.toFixed(4));
    plane.setAttribute('height', (n.aspect * margin).toFixed(4));
    plane.setAttribute('position', '0 0 0.01');
    plane.setAttribute('material', 'shader: flat; transparent: true; opacity: 0');
    target.appendChild(plane);
    planes[idx] = plane;
    return plane;
  }

  function tweenOpacity(el, from, to, durationMs, onDone) {
    var steps = Math.max(1, Math.round(durationMs / 30));
    var i = 0;
    el.setAttribute('material', 'opacity', from);
    var t = setInterval(function () {
      i++;
      var v = from + (to - from) * (i / steps);
      el.setAttribute('material', 'opacity', v);
      if (i >= steps) { clearInterval(t); el.setAttribute('material', 'opacity', to); if (onDone) onDone(); }
    }, 30);
    timers.push(t);
  }

  var gasNames = { S: 'azufre', H: 'hidrógeno', O: 'oxígeno' };
  function paletteSentence(codeRaw) {
    var code = codeRaw.toUpperCase();
    if (code === 'RGB') return 'Esta imagen fue tomada en color real.';
    var names = code.split('').map(function (l) { return gasNames[l] || l; });
    return 'Esta imagen fue tomada utilizando filtros de banda estrecha que sólo registran la luz emitida por los distintos gases de la nebulosa. El canal rojo corresponde al ' + names[0] + ', el canal verde al ' + names[1] + ' y el canal azul al ' + names[2] + '.';
  }

  function buildFlat(d) {
    var pairs, extra;
    if (d.type === 'moon') {
      pairs = [
        ['TÍTULO', d.titulo], ['DIÁMETRO', d.diametro], ['EDAD', d.edad],
        ['DISTANCIA', d.distancia], ['FECHA DE CAPTURA', d.fecha], ['LUGAR DE CAPTURA', d.lugar]
      ];
      extra = d.nota;
    } else {
      pairs = [
        ['TÍTULO', d.titulo], ['CATÁLOGO', d.catalogo], ['TIPO', d.tipo],
        ['CONSTELACIÓN', d.constelacion], ['DISTANCIA', d.distancia],
        ['HORAS DE EXPOSICIÓN', d.horas + ' h']
      ];
      extra = paletteSentence(d.paleta);
    }
    var flat = [];
    pairs.forEach(function (pair) {
      flat.push({ type: 'label', text: pair[0] + '\n' });
      flat.push({ type: 'value', text: pair[1] + '\n\n' });
    });
    flat.push({ type: 'value', text: extra });
    return flat;
  }

  function revealCaption(text, onDone) {
    if (CAPTION_MODE === 'fade') {
      captionEl.textContent = text;
      captionEl.classList.add('visible');
      var t = setTimeout(function () { if (onDone) onDone(); }, 500);
      timers.push(t);
    } else {
      captionEl.textContent = '';
      captionEl.classList.add('visible');
      var i = 0;
      var t2 = setInterval(function () {
        i++;
        captionEl.textContent = text.slice(0, i);
        if (i >= text.length) { clearInterval(t2); if (onDone) onDone(); }
      }, TYPING_SPEED);
      timers.push(t2);
    }
  }

  function startPanelTyping(d) {
    panelEl.innerHTML = '';
    panelEl.classList.add('visible');
    var flat = buildFlat(d);
    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    panelEl.appendChild(cursor);
    var chunkI = 0, charI = 0;
    var t = setInterval(function () {
      if (chunkI >= flat.length) {
        clearInterval(t);
        if (d.anclaje) {
          revealCaption(d.anclaje, function () { fichaBtn.classList.add('shown'); });
        } else {
          fichaBtn.classList.add('shown');
        }
        return;
      }
      var chunk = flat[chunkI];
      charI++;
      var span = panelEl.querySelector('[data-chunk="' + chunkI + '"]');
      if (!span) {
        span = document.createElement('span');
        span.setAttribute('data-chunk', chunkI);
        if (chunk.type === 'label') span.className = 'label';
        panelEl.insertBefore(span, cursor);
      }
      span.textContent = chunk.text.slice(0, charI);
      if (charI >= chunk.text.length) { chunkI++; charI = 0; }
    }, TYPING_SPEED);
    timers.push(t);
  }

  var activeIdx = null;
  var fichaShown = false;
  var typedOnce = false;

  function resetSequence() {
    clearAllTimers();
    Object.keys(planes).forEach(function (k) { planes[k].setAttribute('material', 'opacity', 0); });
    dimOverlay.style.background = 'rgba(12,12,14,0)';
    panelEl.classList.remove('visible');
    panelEl.innerHTML = '';
    captionEl.classList.remove('visible');
    captionEl.textContent = '';
    fichaBtn.classList.remove('shown');
    fichaBtn.textContent = 'Ver ficha técnica';
    fichaShown = false;
    typedOnce = false;
  }

  fichaBtn.addEventListener('click', function () {
    if (activeIdx === null) return;
    var d = TARGETS[activeIdx];
    fichaShown = !fichaShown;
    if (fichaShown) {
      dimOverlay.style.transition = 'background-color ' + VEIL_FADE_MS + 'ms ease';
      dimOverlay.style.background = 'rgba(12,12,14,' + VEIL_OPACITY + ')';
      if (!typedOnce) {
        typedOnce = true;
        startPanelTyping(d);
      } else {
        panelEl.classList.add('visible');
        captionEl.classList.add('visible');
      }
      fichaBtn.textContent = 'Ocultar ficha técnica';
    } else {
      dimOverlay.style.background = 'rgba(12,12,14,0)';
      panelEl.classList.remove('visible');
      captionEl.classList.remove('visible');
      fichaBtn.textContent = 'Ver ficha técnica';
    }
  });

  TARGETS.forEach(function (n, idx) {
    var t = document.getElementById('target-' + idx);
    t.addEventListener('targetFound', function () {
      hint.classList.add('hidden');
      activeIdx = idx;
      var plane = ensurePlane(idx);
      resetSequence();
      tweenOpacity(plane, 0, 1, IMAGE_FADE_MS);
      fichaBtn.classList.add('shown');
    });
    t.addEventListener('targetLost', function () {
      if (activeIdx !== idx) return;
      hint.classList.remove('hidden');
      activeIdx = null;
      resetSequence();
    });
  });
</script>
</body>
</html>
